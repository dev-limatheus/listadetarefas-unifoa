<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To Do</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Lista de Tarefas</h1>
    </header>
    <div class="container">
        <div id="principal-buttons">
          <button onclick="nova_tarefa()" class="btn-novatarefa" id="novatarefa">
            Nova tarefa
          </button>
        </div>
      <div class="tarefas" id="tarefas">
        <input type="text" id="inp-tarefa" placeholder="Nova tarefa" />
        <button onclick="adicionar_tarefa()" id="adicionar">Adicionar</button>
        <button onclick="cancelar_tarefa()" id="cancelar">Cancelar</button>
      </div>
      <ul id="lista"></ul>
    </div>
  </body>
  <script src="script.js"></script>
</html>
