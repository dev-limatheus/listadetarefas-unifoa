<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Lista de Tarefas</h1>
        <div id="principal-buttons">
            <button class="btn-novatarefa" id="novatarefa">Nova tarefa</button>
            <button class="btn-excluir" id="excluir">Excluir</button>
        </div>
    </header>
    <div class="container">
        <div class="tarefas" id="tarefas">
            <input type="text" id="inp-tarefa" placeholder="Nova tarefa">
            <button id="adicionar">Adicionar</button>
            <button id="cancelar">Cancelar</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
